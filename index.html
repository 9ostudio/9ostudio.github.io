<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>9ostudio — メンテナンス中</title>
  <meta name="description" content="ただいまメンテナンス中です。">
  <meta name="theme-color" content="#000000">
  <meta name="robots" content="noindex">
  <style>
    /* japanese web 1.0 — monochrome, single block */

    html, body {
      margin: 0;
      padding: 0;
      color: #cccccc;
      font-family: "MS PGothic", "MS Gothic", "Hiragino Kaku Gothic ProN", "Osaka", "Yu Gothic", sans-serif;
      font-size: 14px;
      line-height: 1.55;
      background: #000000;
    }

    body {
      background-color: #000000;
      background-image:
        radial-gradient(1px 1px at 10% 20%, #fff 50%, transparent 51%),
        radial-gradient(1px 1px at 30% 65%, #aaa 50%, transparent 51%),
        radial-gradient(1px 1px at 55% 15%, #fff 50%, transparent 51%),
        radial-gradient(1px 1px at 70% 80%, #888 50%, transparent 51%),
        radial-gradient(1px 1px at 85% 40%, #fff 50%, transparent 51%),
        radial-gradient(1px 1px at 15% 90%, #aaa 50%, transparent 51%),
        radial-gradient(1px 1px at 45% 45%, #fff 50%, transparent 51%),
        radial-gradient(1px 1px at 92% 70%, #888 50%, transparent 51%),
        radial-gradient(1px 1px at 5% 50%, #fff 50%, transparent 51%),
        radial-gradient(1px 1px at 60% 95%, #aaa 50%, transparent 51%);
      background-size: 220px 220px;
    }

    .wrap {
      width: 680px;
      max-width: 100%;
      margin: 0 auto;
      padding: 16px 8px 28px;
      box-sizing: border-box;
    }

    .page {
      background: #0a0a0a;
      border: 2px solid #666666;
    }

    .masthead {
      background: #1a1a1a;
      border-bottom: 1px solid #555555;
      padding: 10px 12px;
    }

    .masthead h1 {
      margin: 0;
      font-size: 16px;
      font-weight: bold;
      color: #ffffff;
    }

    .masthead .desc {
      margin: 3px 0 0;
      font-size: 12px;
      color: #888888;
    }

    .sect {
      margin: 0;
      padding: 4px 10px;
      font-size: 13px;
      font-weight: bold;
      color: #ffffff;
      background: #222222;
      border-top: 1px solid #444444;
      border-bottom: 1px solid #444444;
    }

    .sect .mark {
      color: #aaaaaa;
    }

    .body {
      padding: 16px 12px;
    }

    .body p {
      margin: 0 0 10px;
    }

    .body p:last-child {
      margin-bottom: 0;
    }

    .en {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px dotted #333333;
      color: #999999;
      font-size: 13px;
    }

    .footer {
      text-align: center;
      font-size: 11px;
      color: #666666;
      border-top: 1px solid #444444;
      padding: 10px 8px;
      background: #111111;
    }

    .footer .quiet {
      margin-top: 4px;
      color: #555555;
    }
  </style>
</head>
<body>

  <div class="wrap">
    <div class="page">

      <div class="masthead">
        <h1>9ostudio</h1>
        <p class="desc">ASM / C · ひとり開発</p>
      </div>

      <h2 class="sect"><span class="mark">■</span> メンテナンス中</h2>

      <div class="body">
        <p>ただいまサイトの更新作業をしています。</p>
        <p>もうしばらくお待ちください。</p>

        <div class="en">
          <p>The site is temporarily down for maintenance.</p>
          <p>Please check back a little later.</p>
        </div>
      </div>

      <div class="footer">
        9ostudio
        <div class="quiet">ASM / C</div>
      </div>

    </div>
  </div>

</body>
</html>
