<meta name="theme-color" content="#000000">
<style>
  * { box-sizing: border-box; }
  html { background: #000; color: #a9a3a3; font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  body {
    margin: 0; min-height: 100vh; padding: 40px 16px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
  }
  main {
    display: flex; flex-direction: column; align-items: center; gap: 24px;
    width: min(100%, 560px); text-align: center;
  }
  section { display: flex; flex-direction: column; align-items: center; gap: 16px; width: 100%; }
  h1 { margin: 0; font-size: 16px; font-weight: normal; color: #fff; }
  footer { color: #555; text-align: center; }
  a, button { color: inherit; }
  a:hover, button:hover, button[aria-pressed="true"] { color: #fff; }
  a:focus-visible, button:focus-visible { outline: 2px solid #fff; outline-offset: 4px; }
  .social { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; }
  .social a { display: block; }
  .social svg { display: block; width: 20px; height: 20px; fill: currentColor; }
  .consoles { display: flex; flex-wrap: wrap; justify-content: center; gap: 24px; }
  .consoles button { padding: 0; border: 0; background: none; font: inherit; cursor: pointer; }
  .consoles button[aria-pressed="true"] { text-decoration: underline; text-underline-offset: 4px; }
  .games { width: 100%; min-height: 1.5em; }
  .games ul { display: grid; justify-items: center; gap: 16px; margin: 0; padding: 0; list-style: none; }
  .games ul[hidden] { display: none; }
  .games a { text-decoration: none; }
  .games li { display: flex; align-items: center; justify-content: center; gap: 14px; }
  .stores, .watch, .downloads { display: flex; gap: 10px; }
  .downloads { margin-right: 6px; }
  .games li.game { display: grid; grid-template-columns: 1fr auto 1fr; width: min(100%, 512px); padding: 0 20px; }
  .shots { grid-column: 1 / -1; display: flex; justify-content: center; gap: 8px; width: 100%; margin-top: 4px; }
  .shots button { width: calc((100% - 24px) / 4); padding: 0; border: 0; background: none; cursor: zoom-in; }
  .shots img { display: block; width: 100%; height: auto; image-rendering: pixelated; }
  .games li.game + li.game { padding-top: 16px; border-top: 1px solid #222; }
  .game .stores { justify-self: start; }
  .game .watch { justify-self: end; }
  @media (max-width: 480px) {
    .games li.game { grid-template-columns: 1fr; justify-items: center; }
    .game .stores, .game .watch { justify-self: center; }
  }
  .games svg { display: block; width: 16px; height: 16px; fill: currentColor; }
  [data-video], [data-play] { padding: 0; border: 0; background: none; cursor: pointer; }
  dialog { width: min(100vw - 32px, 960px, (100vh - 96px) * 16 / 9); max-width: none; padding: 0; border: 0; background: none; color: inherit; overflow: visible; }
  dialog::backdrop { background: rgba(0, 0, 0, .9); }
  dialog iframe { display: block; width: 100%; aspect-ratio: 16 / 9; border: 0; background: #111; }
  dialog[data-mode="game"] { width: min(100vw - 32px, 768px, (100vh - 96px) * var(--ratio, 1.143)); }
  dialog[data-mode="game"] iframe { aspect-ratio: var(--ratio, 1.143); background: #000; }
  dialog[data-mode="image"] { width: fit-content; }
  dialog[data-mode="image"] iframe, dialog:not([data-mode="image"]) .full { display: none; }
  .full { display: block; max-width: min(100vw - 32px, 768px); max-height: calc(100vh - 96px); }
  .close { display: block; margin: 0 0 8px auto; padding: 4px; border: 0; background: none; font: inherit; cursor: pointer; }
  .soon { color: #555; }
</style>

<dialog id="player">
  <button type="button" class="close">Close</button>
  <img class="full" alt="">
  <iframe allow="autoplay; encrypted-media; picture-in-picture; web-share; gamepad" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</dialog>
<script>
  const buttons = document.querySelectorAll('[data-console]');
  function show(name) {
    for (const b of buttons) {
      const on = b.dataset.console === name;
      b.setAttribute('aria-pressed', on);
      document.getElementById('list-' + b.dataset.console).hidden = !on;
    }
  }
  for (const b of buttons) {
    b.addEventListener('click', () => {
      show(b.dataset.console);
      history.replaceState(null, '', '#' + b.dataset.console);
    });
  }
  show(location.hash.slice(1));
  const player = document.getElementById('player');
  const frame = player.querySelector('iframe');
  const picture = player.querySelector('.full');
  for (const t of document.querySelectorAll('[data-video], [data-play], [data-image]')) {
    t.addEventListener('click', () => {
      const mode = 'image' in t.dataset ? 'image' : 'play' in t.dataset ? 'game' : 'video';
      player.dataset.mode = mode;
      player.style.setProperty('--ratio', t.dataset.ratio || '1.143');
      if (mode === 'image') {
        picture.src = t.dataset.image;
        picture.alt = t.getAttribute('aria-label');
      } else {
        frame.title = t.getAttribute('aria-label');
        frame.src = mode === 'game' ? t.dataset.play : 'https://www.youtube-nocookie.com/embed/' + t.dataset.video + '?autoplay=1';
      }
      player.showModal();
      if (mode === 'game') frame.addEventListener('load', () => frame.contentWindow.focus(), { once: true });
    });
  }
  player.addEventListener('click', () => player.close());
  player.addEventListener('close', () => {
    frame.src = 'about:blank';
    picture.removeAttribute('src');
  });
</script>
