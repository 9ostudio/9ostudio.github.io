      padding: 0;
      color: #cccccc;

        radial-gradient(1px 1px at 30% 65%, #aaa 50%, transparent 51%),
        radial-gradient(1px 1px at 55% 15%, #fff 50%, transparent 51%),
        radial-gradient(1px 1px at 70% 80%, #888 50%, transparent 51%),
        radial-gradient(1px 1px at 85% 40%, #fff 50%, transparent 51%),
        radial-gradient(1px 1px at 15% 90%, #aaa 50%, transparent 51%),
        radial-gradient(1px 1px at 45% 45%, #fff 50%, transparent 51%),
        radial-gradient(1px 1px at 92% 70%, #888 50%, transparent 51%),
        radial-gradient(1px 1px at 5% 50%, #fff 50%, transparent 51%),
        radial-gradient(1px 1px at 60% 95%, #aaa 50%, transparent 51%);

    }

    a {
      color: #ffffff;

    }

    .page {
      background: #0a0a0a;
      border: 2px solid #666666;
    }

    .nav {
      padding: 8px 12px;
      font-size: 13px;
      border-bottom: 1px solid #444444;

      color: #666666;

      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;

    }

    .nav-links {

      flex-wrap: wrap;

    }

    .nav a {
      color: #cccccc;
      text-decoration: none;
      white-space: nowrap;
    }

    .nav a:visited { color: #cccccc; }
    .nav a:hover { color: #000000; background: #ffffff; text-decoration: none; }
    .nav .sep { margin: 0 4px; color: #555555; }
    .nav .here { color: #ffffff; font-weight: bold; }

    .lang {
      font-size: 12px;
      white-space: nowrap;
      margin-left: auto;
      line-height: 1.8;
    }

    .lang a {
      color: #888888;
      text-decoration: none;
      padding: 0 2px;
    }

    .lang a:hover {

      background: #ffffff;
      text-decoration: none;
    }

    .lang .sep {
      margin: 0 2px;
      color: #555555;
    }

    .masthead {
      background: #1a1a1a;
      border-bottom: 1px solid #555555;
      padding: 10px 12px;
    }

    .masthead h1 {
      margin: 0;
      font-size: 16px;
      font-weight: bold;
      color: #ffffff;
    }

    .masthead .desc {
      margin: 3px 0 0;
      font-size: 12px;
      color: #888888;
    }

    .sect {
      margin: 0;
      padding: 4px 10px;
      font-size: 13px;
      font-weight: bold;
      color: #ffffff;
      background: #222222;
      border-top: 1px solid #444444;
      border-bottom: 1px solid #444444;
    }

    .sect .mark { color: #aaaaaa; }

    .player {
      background: #000000;
      border-bottom: 1px solid #333333;
      aspect-ratio: 16 / 9;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #555555;
      font-size: 13px;
      position: relative;
    }

    .player video,
    .player iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #000;
    }

    .player .placeholder {
      text-align: center;
      padding: 16px;
      color: #666666;
      font-size: 12px;
      line-height: 1.7;
    }

    .player .placeholder strong {
      display: block;
      color: #999999;
      font-size: 14px;
      margin-bottom: 4px;
    }

    .list {
      list-style: none;
      margin: 0;
      padding: 0;
      font-size: 13px;
    }

    .list li {
      padding: 8px 12px;
      border-bottom: 1px dotted #333333;
    }

    .list li:last-child { border-bottom: none; }
    .list li:hover { background: #141414; }

    .list button {
      display: block;
      width: 100%;
      text-align: left;
      background: none;
      border: 0;
      padding: 0;
      color: inherit;
      font: inherit;
      cursor: pointer;
    }

    .list .name {

    }

    .list .meta {

      font-size: 12px;

    .list .empty {

    .note {

      margin: 0;

    .footer {

      font-size: 11px;
      color: #666666;

    }

    .footer .quiet {
      margin-top: 4px;
      color: #555555;
    }

    @media (max-width: 700px) {

<body>

  <div class="wrap">
    <div class="page">

      <nav class="nav" aria-label="メニュー">
        <div class="nav-links">
          <a href="index.html" data-i18n="nav.top">トップ</a>
          <span class="sep">|</span>
          <a href="news.html" data-i18n="nav.news">ニュース</a>
          <span class="sep">|</span>
          <a href="work.html" data-i18n="nav.work">作品</a>
          <span class="sep">|</span>
          <span class="here" data-i18n="nav.vod">VOD</span>
          <span class="sep">|</span>
          <a href="live.html" data-i18n="nav.live">LIVE</a>
          <span class="sep">|</span>
          <a href="git.html" data-i18n="nav.git">Git</a><span class="sep">|</span>
          <a href="forum.html" data-i18n="nav.forum">掲示板</a>
        </div>
        <div class="lang" aria-label="Language">
          <a href="#" data-lang="ja">JP</a><span class="sep">/</span><a href="#" data-lang="en">EN</a>
        </div>
      </nav>

      <div class="masthead">
        <h1 data-i18n="vod.title">9ostudio VOD</h1>
        <p class="desc" data-i18n="vod.desc">録画アーカイブ</p>
      </div>

      <div class="player" id="player">
        <div class="placeholder" id="player-placeholder">
          <strong>■ VOD PLAYER</strong>
          <span data-i18n="vod.placeholder" data-i18n-html="1">下の一覧から選んでください<br>（まだ動画がありません）</span>
        </div>
      </div>

      <h2 class="sect"><span class="mark">■</span> <span data-i18n="vod.sect">一覧</span></h2>
      <ul class="list" id="vod-list">
        <li class="empty" data-i18n="vod.empty">まだ VOD はありません。admin から追加できます。</li>
      </ul>
      <p class="note" data-i18n="vod.note">※ 動画を追加したらここに並びます。</p>

      <div class="footer">
        <div>© 9ostudio</div>
        <div class="quiet" data-i18n="footer.solo">このページはひとりでコツコツ更新しています</div>
      </div>

    </div>
  </div>

  <script src="js/site-data.js"></script>
  <script src="js/i18n.js"></script>
  <script>
    var list = document.getElementById("vod-list");
    var player = document.getElementById("player");
    var currentObjectUrl = null;

    function playVod(item) {
      if (currentObjectUrl) {
        try { URL.revokeObjectURL(currentObjectUrl); } catch (e) {}
        currentObjectUrl = null;
      }
      player.innerHTML = '<div class="placeholder">読み込み中…</div>';

      SiteData.resolveVodSrc(item).then(function (src) {
        player.innerHTML = "";
        if (!src) {
          player.innerHTML =
            '<div class="placeholder"><strong>■ VOD</strong>ソースがありません</div>';
          return;
        }
        if (item.fileId && src.indexOf("blob:") === 0) currentObjectUrl = src;

        if (item.type === "iframe") {
          var iframe = document.createElement("iframe");
          iframe.src = src;
          iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture";
          iframe.allowFullscreen = true;
          iframe.title = item.title || "VOD";
          player.appendChild(iframe);
        } else {
          var video = document.createElement("video");
          video.src = src;
          video.controls = true;
          video.autoplay = true;
          video.playsInline = true;
          player.appendChild(video);
        }
      });
    }

    SiteData.load().then(function (data) {
      var vods = data.vods || [];
      if (!vods.length) {
        var empty = (window.I18n && I18n.t("vod.empty")) || "まだ VOD はありません。admin から追加できます。";
        list.innerHTML = '<li class="empty"></li>';
        list.querySelector(".empty").textContent = empty;
        return;
      }
      list.innerHTML = "";
      vods.forEach(function (item, i) {
        var li = document.createElement("li");
        var btn = document.createElement("button");
        btn.type = "button";
        btn.innerHTML =
          '<div class="name"></div><div class="meta"></div>';
        btn.querySelector(".name").textContent = item.title || "(無題)";
        btn.querySelector(".meta").textContent =
          (item.date || "") + (item.note ? " · " + item.note : "") +
          (item.fileId ? " · local upload" : "");
        btn.addEventListener("click", function () { playVod(item); });
        li.appendChild(btn);
        list.appendChild(li);
        if (i === 0) playVod(item);
      });
    });
  </script>

</body>
