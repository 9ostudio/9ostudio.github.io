<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<title>過去ログ - 9oSTUDIO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<link rel="stylesheet" href="/site.css">
</head>
<body class="page">
<header class="bar-top"><a class="back" id="back" href="/" data-t="back">戻る</a><h1 id="title">過去ログ</h1></header>
<main class="list" id="list"></main>
<script src="/site.js"></script>
<script>
  const kinds = ['feeds', 'works', 'art', 'video', 'music', 'blog'];
  const which = kinds.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'feeds';
  Site.back(document.getElementById('back'), '/#' + which);
  const list = document.getElementById('list');
  Site.data('../').then(data => {
    data = data || {};
    const draw = () => {
      const name = Site.t(which) + ' ' + Site.t('archive');
      document.getElementById('title').textContent = name;
      document.title = name + ' - 9oSTUDIO';
      const items = data[which];
      if (which === 'works') Site.works(list, items, Infinity, '../');
      else if (which === 'art' || which === 'video') Site.grid(list, items, which, '../');
      else if (which === 'music') Site.music(list, items, Infinity, '../');
      else Site.feed(list, items, Infinity, which, '../');
    };
    draw();
    Site.switcher(draw);
  });
</script>
</body>
</html>
